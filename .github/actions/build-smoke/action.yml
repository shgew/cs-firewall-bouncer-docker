name: Build and smoke-test
description: Builds the image for both architectures and runs the container smoke test on amd64.

inputs:
  version:
    description: Upstream cs-firewall-bouncer version to pin
    required: true
  sha_amd64:
    description: sha256 of the upstream linux-amd64 tarball
    required: true
  sha_arm64:
    description: sha256 of the upstream linux-arm64 tarball
    required: true
  image_ref:
    description: Local tag for the image under smoke test
    required: false
    default: local/csfb:gate
  platforms:
    description: Comma-separated build platforms
    required: false
    default: linux/amd64,linux/arm64

runs:
  using: composite
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

    - name: Build both architectures
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
      with:
        context: .
        push: false
        platforms: ${{ inputs.platforms }}
        build-args: |
          CS_FIREWALL_BOUNCER_VERSION=${{ inputs.version }}
          CS_TARBALL_SHA256_AMD64=${{ inputs.sha_amd64 }}
          CS_TARBALL_SHA256_ARM64=${{ inputs.sha_arm64 }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Load amd64 for smoke test
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
      with:
        context: .
        push: false
        load: true
        platforms: linux/amd64
        tags: ${{ inputs.image_ref }}
        build-args: |
          CS_FIREWALL_BOUNCER_VERSION=${{ inputs.version }}
          CS_TARBALL_SHA256_AMD64=${{ inputs.sha_amd64 }}
          CS_TARBALL_SHA256_ARM64=${{ inputs.sha_arm64 }}
        cache-from: type=gha

    - name: Smoke test
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.image_ref }}
        VERSION: ${{ inputs.version }}
      run: scripts/smoke-test.sh "$IMAGE_REF" "$VERSION"
