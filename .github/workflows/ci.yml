name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Shellcheck
        run: shellcheck entrypoint.sh scripts/*.sh

      - name: Hadolint
        run: docker run --rm -i -v "$PWD:/mnt" -w /mnt hadolint/hadolint:v2.14.0 hadolint Dockerfile

      - name: Actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run unit tests
        run: bats test/

  build-smoke:
    runs-on: ubuntu-latest
    needs: [lint, unit]
    strategy:
      matrix:
        channel: [stable, rc]
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Resolve channel build args
        id: vars
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          VERSION=$(jq -r ".${CHANNEL}.version" versions.json)
          SHA_AMD64=$(jq -r ".${CHANNEL}.tarballs.amd64" versions.json)
          SHA_ARM64=$(jq -r ".${CHANNEL}.tarballs.arm64" versions.json)
          {
            echo "version=${VERSION}"
            echo "sha_amd64=${SHA_AMD64}"
            echo "sha_arm64=${SHA_ARM64}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build both platforms (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          build-args: |
            CS_FIREWALL_BOUNCER_VERSION=${{ steps.vars.outputs.version }}
            CS_TARBALL_SHA256_AMD64=${{ steps.vars.outputs.sha_amd64 }}
            CS_TARBALL_SHA256_ARM64=${{ steps.vars.outputs.sha_arm64 }}

      - name: Build amd64 for smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: local/csfb:${{ matrix.channel }}-ci
          build-args: |
            CS_FIREWALL_BOUNCER_VERSION=${{ steps.vars.outputs.version }}
            CS_TARBALL_SHA256_AMD64=${{ steps.vars.outputs.sha_amd64 }}
            CS_TARBALL_SHA256_ARM64=${{ steps.vars.outputs.sha_arm64 }}

      - name: Smoke test
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          CHANNEL: ${{ matrix.channel }}
        run: scripts/smoke-test.sh "local/csfb:${CHANNEL}-ci" "$VERSION"
