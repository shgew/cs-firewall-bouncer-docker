name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Shellcheck
        run: shellcheck entrypoint.sh scripts/*.sh

      - name: Hadolint
        run: docker run --rm -i -v "$PWD:/mnt" -w /mnt hadolint/hadolint:v2.14.0 hadolint Dockerfile

      - name: Actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run unit tests
        run: bats test/

  build-smoke:
    runs-on: ubuntu-latest
    needs: [lint, unit]
    strategy:
      matrix:
        channel: [stable, rc]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve channel build args
        id: vars
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          VERSION=$(jq -r ".${CHANNEL}.version" versions.json)
          SHA_AMD64=$(jq -r ".${CHANNEL}.tarballs.amd64" versions.json)
          SHA_ARM64=$(jq -r ".${CHANNEL}.tarballs.arm64" versions.json)
          {
            echo "version=${VERSION}"
            echo "sha_amd64=${SHA_AMD64}"
            echo "sha_arm64=${SHA_ARM64}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and smoke-test
        uses: ./.github/actions/build-smoke
        with:
          version: ${{ steps.vars.outputs.version }}
          sha_amd64: ${{ steps.vars.outputs.sha_amd64 }}
          sha_arm64: ${{ steps.vars.outputs.sha_arm64 }}
          image_ref: local/csfb:${{ matrix.channel }}-ci
