name: Cut Patch Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel whose image to rebuild
        type: choice
        options: [stable, rc]
        default: stable
      notes:
        description: What changed in the container
        type: string
        required: true
      dry_run:
        type: boolean
        default: false

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the default branch
        env:
          SELECTED_REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$SELECTED_REF" != "$DEFAULT_BRANCH" ]; then
            echo "Patch releases must be dispatched from ${DEFAULT_BRANCH}, got ${SELECTED_REF}." >&2
            echo "An older ref pins an older versions.json, which would move the channel aliases backwards." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Compute patch tag
        id: tag
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          git ls-remote --tags origin \
            | sed -e 's|.*refs/tags/||' -e 's|\^{}$||' \
            | sort -u > /tmp/existing-tags.txt
          TAG=$(scripts/next-release-tag.sh patch "$CHANNEL" versions.json /tmp/existing-tags.txt)
          TARGET_SHA=$(git rev-parse HEAD)
          {
            echo "tag=${TAG}"
            echo "target_sha=${TARGET_SHA}"
          } >> "$GITHUB_OUTPUT"
          echo "Next ${CHANNEL} patch tag: ${TAG} targeting ${TARGET_SHA}"

      - name: Resolve release plan
        id: plan
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          IMAGE_BASE: ghcr.io/${{ github.repository }}
        run: |
          PLAN=$(scripts/release-plan.sh "$RELEASE_TAG" versions.json "$IMAGE_BASE")
          echo "$PLAN"
          {
            echo "version=$(jq -r '.version' <<<"$PLAN")"
            echo "sha_amd64=$(jq -r '.tarballs.amd64' <<<"$PLAN")"
            echo "sha_arm64=$(jq -r '.tarballs.arm64' <<<"$PLAN")"
          } >> "$GITHUB_OUTPUT"

      - name: Gate the patch on a passing build and smoke test
        uses: ./.github/actions/build-smoke
        with:
          version: ${{ steps.plan.outputs.version }}
          sha_amd64: ${{ steps.plan.outputs.sha_amd64 }}
          sha_arm64: ${{ steps.plan.outputs.sha_arm64 }}
          image_ref: local/csfb:patch-gate

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        env:
          CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          TARGET_SHA: ${{ steps.tag.outputs.target_sha }}
        run: |
          {
            echo "## Dry-run: planned patch release"
            echo "- channel: ${CHANNEL}"
            echo "- tag: ${RELEASE_TAG}"
            echo "- target: ${TARGET_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create patch release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_NOTES: ${{ inputs.notes }}
          TARGET_SHA: ${{ steps.tag.outputs.target_sha }}
        run: |
          UPSTREAM="${RELEASE_TAG%%+*}"
          NOTES="Container-only rebuild of CrowdSec Firewall Bouncer ${UPSTREAM}. The upstream binary is unchanged."$'\n\n'"${RELEASE_NOTES}"
          if [ "$CHANNEL" = "rc" ]; then
            gh release create "$RELEASE_TAG" \
              --target "$TARGET_SHA" \
              --prerelease \
              --title "$RELEASE_TAG" \
              --notes "$NOTES"
          else
            gh release create "$RELEASE_TAG" \
              --target "$TARGET_SHA" \
              --title "$RELEASE_TAG" \
              --notes "$NOTES"
          fi
          echo "- created ${CHANNEL} patch release ${RELEASE_TAG} at ${TARGET_SHA}" >> "$GITHUB_STEP_SUMMARY"
