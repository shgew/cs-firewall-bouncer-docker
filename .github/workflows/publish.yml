name: Build and Publish Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Resolve release plan
        id: vars
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IMAGE_BASE: ghcr.io/${{ github.repository }}
        run: |
          PLAN=$(scripts/release-plan.sh "${RELEASE_TAG}" versions.json "${IMAGE_BASE}")
          echo "$PLAN"
          {
            echo "version=$(jq -r '.version' <<<"$PLAN")"
            echo "docker_tag=$(jq -r '.docker_tag' <<<"$PLAN")"
            echo "sha_amd64=$(jq -r '.tarballs.amd64' <<<"$PLAN")"
            echo "sha_arm64=$(jq -r '.tarballs.arm64' <<<"$PLAN")"
            echo "tags<<ENDOFTAGS"
            jq -r '.image_tags[]' <<<"$PLAN"
            echo "ENDOFTAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Gate the release on a passing build and smoke test
        uses: ./.github/actions/build-smoke
        with:
          version: ${{ steps.vars.outputs.version }}
          sha_amd64: ${{ steps.vars.outputs.sha_amd64 }}
          sha_arm64: ${{ steps.vars.outputs.sha_arm64 }}
          image_ref: local/csfb:publish-gate
          platforms: ${{ env.PLATFORMS }}

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.vars.outputs.tags }}
          build-args: |
            CS_FIREWALL_BOUNCER_VERSION=${{ steps.vars.outputs.version }}
            CS_TARBALL_SHA256_AMD64=${{ steps.vars.outputs.sha_amd64 }}
            CS_TARBALL_SHA256_ARM64=${{ steps.vars.outputs.sha_arm64 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=CrowdSec Firewall Bouncer Docker image
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.vars.outputs.docker_tag }}
            org.opencontainers.image.revision=${{ github.sha }}

  dry-run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        channel: [stable, rc]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate versions.json
        run: jq -e '.stable.version and .rc.version' versions.json

      - name: Resolve channel vars
        id: vars
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          VERSION=$(jq -r ".${CHANNEL}.version" versions.json)
          SHA_AMD64=$(jq -r ".${CHANNEL}.tarballs.amd64" versions.json)
          SHA_ARM64=$(jq -r ".${CHANNEL}.tarballs.arm64" versions.json)
          {
            echo "version=${VERSION}"
            echo "sha_amd64=${SHA_AMD64}"
            echo "sha_arm64=${SHA_ARM64}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and smoke-test
        uses: ./.github/actions/build-smoke
        with:
          version: ${{ steps.vars.outputs.version }}
          sha_amd64: ${{ steps.vars.outputs.sha_amd64 }}
          sha_arm64: ${{ steps.vars.outputs.sha_arm64 }}
          image_ref: local/csfb:${{ matrix.channel }}-dryrun
          platforms: ${{ env.PLATFORMS }}

      - name: Dry-run summary
        env:
          CHANNEL: ${{ matrix.channel }}
          VERSION: ${{ steps.vars.outputs.version }}
          SHA_AMD64: ${{ steps.vars.outputs.sha_amd64 }}
          SHA_ARM64: ${{ steps.vars.outputs.sha_arm64 }}
        run: |
          {
            echo "## Dry-run: ${CHANNEL} channel"
            echo "- Version: ${VERSION}"
            echo "- AMD64 SHA: ${SHA_AMD64}"
            echo "- ARM64 SHA: ${SHA_ARM64}"
          } >> "$GITHUB_STEP_SUMMARY"
