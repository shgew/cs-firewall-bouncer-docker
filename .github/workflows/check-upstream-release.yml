name: Check Upstream Release

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Fetch upstream releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate repos/crowdsecurity/cs-firewall-bouncer/releases --jq '.[]' | jq -s '.' > /tmp/releases.json

      - name: Resolve new channel heads
        run: |
          scripts/resolve-upstream.sh /tmp/releases.json versions.json > /tmp/new-versions.json

      - name: Detect changes
        id: detect
        run: |
          STABLE_OLD=$(jq -r '.stable.version' versions.json)
          STABLE_NEW=$(jq -r '.stable.version' /tmp/new-versions.json)
          RC_OLD=$(jq -r '.rc.version' versions.json)
          RC_NEW=$(jq -r '.rc.version' /tmp/new-versions.json)
          STABLE_CHANGED=false
          RC_CHANGED=false
          if [ "$STABLE_OLD" != "$STABLE_NEW" ]; then STABLE_CHANGED=true; fi
          if [ "$RC_OLD" != "$RC_NEW" ]; then RC_CHANGED=true; fi
          {
            echo "stable_old=${STABLE_OLD}"
            echo "stable_new=${STABLE_NEW}"
            echo "rc_old=${RC_OLD}"
            echo "rc_new=${RC_NEW}"
            echo "stable_changed=${STABLE_CHANGED}"
            echo "rc_changed=${RC_CHANGED}"
          } >> "$GITHUB_OUTPUT"

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Dry-run: planned changes"
            echo "- stable: ${{ steps.detect.outputs.stable_old }} -> ${{ steps.detect.outputs.stable_new }} (changed: ${{ steps.detect.outputs.stable_changed }})"
            echo "- rc: ${{ steps.detect.outputs.rc_old }} -> ${{ steps.detect.outputs.rc_new }} (changed: ${{ steps.detect.outputs.rc_changed }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check if anything changed
        if: ${{ !inputs.dry_run && steps.detect.outputs.stable_changed == 'false' && steps.detect.outputs.rc_changed == 'false' }}
        run: |
          echo "No channel changes detected, nothing to do."

      - name: Commit updated versions.json
        if: ${{ !inputs.dry_run && (steps.detect.outputs.stable_changed == 'true' || steps.detect.outputs.rc_changed == 'true') }}
        run: |
          cp /tmp/new-versions.json versions.json
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add versions.json
          STABLE_CHANGED="${{ steps.detect.outputs.stable_changed }}"
          RC_CHANGED="${{ steps.detect.outputs.rc_changed }}"
          STABLE_NEW="${{ steps.detect.outputs.stable_new }}"
          RC_NEW="${{ steps.detect.outputs.rc_new }}"
          if [ "$STABLE_CHANGED" = "true" ] && [ "$RC_CHANGED" = "true" ]; then
            git commit -m "Update stable to ${STABLE_NEW}, rc to ${RC_NEW}"
          elif [ "$STABLE_CHANGED" = "true" ]; then
            git commit -m "Update stable to ${STABLE_NEW}"
          else
            git commit -m "Update rc to ${RC_NEW}"
          fi
          git push
          echo "SYNC_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create stable release
        if: ${{ !inputs.dry_run && steps.detect.outputs.stable_changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="${{ steps.detect.outputs.stable_new }}"
          TAG_SHA=$(git ls-remote origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" | \
            awk -v ref="refs/tags/${TAG}" '$2 == ref "^{}" { peeled=$1 } $2 == ref { plain=$1 } END { print (peeled != "" ? peeled : plain) }')
          if [ -z "$TAG_SHA" ]; then
            gh release create "$TAG" \
              --target "$SYNC_SHA" \
              --title "$TAG" \
              --notes "This release tracks CrowdSec Firewall Bouncer [${TAG}](https://github.com/crowdsecurity/cs-firewall-bouncer/releases/tag/${TAG})."
          elif [ "$TAG_SHA" = "$SYNC_SHA" ]; then
            gh release view "$TAG" > /dev/null 2>&1 || \
              gh release create "$TAG" \
                --title "$TAG" \
                --notes "This release tracks CrowdSec Firewall Bouncer [${TAG}](https://github.com/crowdsecurity/cs-firewall-bouncer/releases/tag/${TAG})."
          else
            echo "ERROR: tag ${TAG} exists at ${TAG_SHA}, expected ${SYNC_SHA} - resolve manually" >&2
            exit 1
          fi

      - name: Create rc release
        if: ${{ !inputs.dry_run && steps.detect.outputs.rc_changed == 'true' && steps.detect.outputs.rc_new != steps.detect.outputs.stable_new }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="${{ steps.detect.outputs.rc_new }}"
          TAG_SHA=$(git ls-remote origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" | \
            awk -v ref="refs/tags/${TAG}" '$2 == ref "^{}" { peeled=$1 } $2 == ref { plain=$1 } END { print (peeled != "" ? peeled : plain) }')
          if [ -z "$TAG_SHA" ]; then
            gh release create "$TAG" \
              --target "$SYNC_SHA" \
              --prerelease \
              --title "$TAG" \
              --notes "This release tracks CrowdSec Firewall Bouncer [${TAG}](https://github.com/crowdsecurity/cs-firewall-bouncer/releases/tag/${TAG}) (release candidate)."
          elif [ "$TAG_SHA" = "$SYNC_SHA" ]; then
            gh release view "$TAG" > /dev/null 2>&1 || \
              gh release create "$TAG" \
                --prerelease \
                --title "$TAG" \
                --notes "This release tracks CrowdSec Firewall Bouncer [${TAG}](https://github.com/crowdsecurity/cs-firewall-bouncer/releases/tag/${TAG}) (release candidate)."
          else
            echo "ERROR: tag ${TAG} exists at ${TAG_SHA}, expected ${SYNC_SHA} - resolve manually" >&2
            exit 1
          fi
