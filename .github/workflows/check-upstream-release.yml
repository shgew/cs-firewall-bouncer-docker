name: Check Upstream Release

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Fetch upstream releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate repos/crowdsecurity/cs-firewall-bouncer/releases --jq '.[]' | jq -s '.' > /tmp/releases.json

      - name: Resolve new channel heads
        run: |
          scripts/resolve-upstream.sh /tmp/releases.json versions.json > /tmp/new-versions.json

      - name: Detect changes
        id: detect
        run: |
          STABLE_OLD=$(jq -r '.stable.version' versions.json)
          STABLE_NEW=$(jq -r '.stable.version' /tmp/new-versions.json)
          RC_OLD=$(jq -r '.rc.version' versions.json)
          RC_NEW=$(jq -r '.rc.version' /tmp/new-versions.json)
          STABLE_CHANGED=false
          RC_CHANGED=false
          if [ "$STABLE_OLD" != "$STABLE_NEW" ]; then STABLE_CHANGED=true; fi
          if [ "$RC_OLD" != "$RC_NEW" ]; then RC_CHANGED=true; fi
          {
            echo "stable_old=${STABLE_OLD}"
            echo "stable_new=${STABLE_NEW}"
            echo "rc_old=${RC_OLD}"
            echo "rc_new=${RC_NEW}"
            echo "stable_changed=${STABLE_CHANGED}"
            echo "rc_changed=${RC_CHANGED}"
            echo "stable_sha_amd64=$(jq -r '.stable.tarballs.amd64' /tmp/new-versions.json)"
            echo "stable_sha_arm64=$(jq -r '.stable.tarballs.arm64' /tmp/new-versions.json)"
            echo "rc_sha_amd64=$(jq -r '.rc.tarballs.amd64' /tmp/new-versions.json)"
            echo "rc_sha_arm64=$(jq -r '.rc.tarballs.arm64' /tmp/new-versions.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Dry-run: planned changes"
            echo "- stable: ${{ steps.detect.outputs.stable_old }} -> ${{ steps.detect.outputs.stable_new }} (changed: ${{ steps.detect.outputs.stable_changed }})"
            echo "- rc: ${{ steps.detect.outputs.rc_old }} -> ${{ steps.detect.outputs.rc_new }} (changed: ${{ steps.detect.outputs.rc_changed }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gate new stable on a passing build and smoke test
        if: ${{ steps.detect.outputs.stable_changed == 'true' }}
        uses: ./.github/actions/build-smoke
        with:
          version: ${{ steps.detect.outputs.stable_new }}
          sha_amd64: ${{ steps.detect.outputs.stable_sha_amd64 }}
          sha_arm64: ${{ steps.detect.outputs.stable_sha_arm64 }}
          image_ref: local/csfb:stable-gate

      - name: Gate new rc on a passing build and smoke test
        if: ${{ steps.detect.outputs.rc_changed == 'true' && steps.detect.outputs.rc_new != steps.detect.outputs.stable_new }}
        uses: ./.github/actions/build-smoke
        with:
          version: ${{ steps.detect.outputs.rc_new }}
          sha_amd64: ${{ steps.detect.outputs.rc_sha_amd64 }}
          sha_arm64: ${{ steps.detect.outputs.rc_sha_arm64 }}
          image_ref: local/csfb:rc-gate

      - name: Report no changes
        if: ${{ !inputs.dry_run && steps.detect.outputs.stable_changed == 'false' && steps.detect.outputs.rc_changed == 'false' }}
        run: echo "No channel changes detected, nothing to do."

      - name: Commit updated versions.json
        if: ${{ !inputs.dry_run && (steps.detect.outputs.stable_changed == 'true' || steps.detect.outputs.rc_changed == 'true') }}
        env:
          STABLE_CHANGED: ${{ steps.detect.outputs.stable_changed }}
          RC_CHANGED: ${{ steps.detect.outputs.rc_changed }}
          STABLE_NEW: ${{ steps.detect.outputs.stable_new }}
          RC_NEW: ${{ steps.detect.outputs.rc_new }}
        run: |
          cp /tmp/new-versions.json versions.json
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add versions.json
          if [ "$STABLE_CHANGED" = "true" ] && [ "$RC_CHANGED" = "true" ]; then
            git commit -m "Update stable to ${STABLE_NEW}, rc to ${RC_NEW}"
          elif [ "$STABLE_CHANGED" = "true" ]; then
            git commit -m "Update stable to ${STABLE_NEW}"
          else
            git commit -m "Update rc to ${RC_NEW}"
          fi
          git push
          echo "SYNC_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create mirror releases
        if: ${{ !inputs.dry_run && (steps.detect.outputs.stable_changed == 'true' || steps.detect.outputs.rc_changed == 'true') }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          STABLE_CHANGED: ${{ steps.detect.outputs.stable_changed }}
          RC_CHANGED: ${{ steps.detect.outputs.rc_changed }}
          STABLE_NEW: ${{ steps.detect.outputs.stable_new }}
          RC_NEW: ${{ steps.detect.outputs.rc_new }}
        run: |
          git ls-remote --tags origin \
            | sed -e 's|.*refs/tags/||' -e 's|\^{}$||' \
            | sort -u > /tmp/existing-tags.txt

          channels=()
          if [ "$STABLE_CHANGED" = "true" ]; then
            channels+=(stable)
          fi
          if [ "$RC_CHANGED" = "true" ] && [ "$RC_NEW" != "$STABLE_NEW" ]; then
            channels+=(rc)
          fi
          if [ "${#channels[@]}" -eq 0 ]; then
            echo "rc head caught up with stable, the stable release covers both channels."
            exit 0
          fi

          for channel in "${channels[@]}"; do
            TAG=$(scripts/next-release-tag.sh mirror "$channel" versions.json /tmp/existing-tags.txt)
            NOTES="This release mirrors CrowdSec Firewall Bouncer [${TAG}](https://github.com/crowdsecurity/cs-firewall-bouncer/releases/tag/${TAG}) with no container changes."
            if [ "$channel" = "rc" ]; then
              gh release create "$TAG" \
                --target "$SYNC_SHA" \
                --prerelease \
                --title "$TAG" \
                --notes "${NOTES} Release candidate: published to the rc channel only."
            else
              gh release create "$TAG" \
                --target "$SYNC_SHA" \
                --title "$TAG" \
                --notes "$NOTES"
            fi
            echo "$TAG" >> /tmp/existing-tags.txt
            echo "- created ${channel} release ${TAG}" >> "$GITHUB_STEP_SUMMARY"
          done
